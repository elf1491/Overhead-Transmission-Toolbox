<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTT - Overhead Transmission Toolbox</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="icon.png">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="brand">
      <span class="badge-logo">OTT</span>
      <div class="brand-text">
        <h1>Overhead Transmission Toolbox</h1>
        <p>High-Voltage Engineering Suite</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="unit-toggle-btn" id="unitToggleBtn">Units: US</button>
      <button class="unit-toggle-btn chat-header-trigger" onclick="toggleChatModal()">💬 Assistant</button>
    </div>
  </header>

  <!-- Category Tabs -->
  <nav class="category-nav">
    <button class="nav-tab active" data-category="line_design">Line Design</button>
    <button class="nav-tab" data-category="corrosion">Corrosion</button>
    <button class="nav-tab" data-category="inspection">Inspection & Assessment</button>
    <button class="nav-tab" data-category="lightning">Lightning & Grounding</button>
    <button class="nav-tab" data-category="conductor">Conductor & Hardware</button>
    <button class="nav-tab" data-category="row_env">Right-of-Way & Env</button>
    <button class="nav-tab" data-category="glossary">Glossary</button>
    <button class="nav-tab" data-category="study">Study & Quiz</button>
  </nav>

  <!-- Main Content Area -->
  <main>
    <div class="search-container">
      <input type="text" id="globalSearchInput" class="search-input" placeholder="Search all calculators, simulations, and standards (e.g., Catenary, IEEE 738, ASCE 10, Drake)...">
    </div>

    <div id="contentArea"></div>
  </main>

  <!-- Floating Chatbot Action Button -->
  <button class="chat-fab-btn" onclick="toggleChatModal()" title="Ask Transmission Engineering Assistant">
    <span class="fab-icon">🤖</span>
    <span>Ask Assistant</span>
  </button>

  <!-- Chatbot Modal -->
  <div class="chat-modal-overlay" id="chatModal" onclick="if(event.target === this) toggleChatModal()">
    <div class="chat-modal-window">
      <div class="chat-modal-header">
        <div class="chat-header-title">
          <span style="font-size: 1.4rem;">⚡</span>
          <div>
            <h3>Transmission Assistant</h3>
            <span>Standards, formulas & calculator guide</span>
          </div>
        </div>
        <button class="chat-close-btn" onclick="toggleChatModal()">✕</button>
      </div>

      <div class="chat-quick-chips">
        <button class="quick-chip" onclick="askQuickQuestion('How does conductor surface emissivity affect ampacity?')">Emissivity & Rating</button>
        <button class="quick-chip" onclick="askQuickQuestion('What is the minimum ground clearance for a 138 kV line over roads?')">NESC 232 Road</button>
        <button class="quick-chip" onclick="askQuickQuestion('How is live-line Minimum Approach Distance calculated?')">OSHA MAD</button>
        <button class="quick-chip" onclick="askQuickQuestion('What is the formula for conductor catenary sag?')">Catenary Sag</button>
        <button class="quick-chip" onclick="askQuickQuestion('How long does zinc galvanizing last in industrial C4 environments?')">Zinc Coating Life</button>
        <button class="quick-chip" onclick="askQuickQuestion('What are the core requirements of FERC Order 881 for AAR?')">FERC 881 AAR</button>
      </div>

      <div class="chat-messages-area" id="chatMessagesArea"></div>

      <div class="chat-input-bar">
        <input type="text" id="chatUserInput" class="chat-input-field" placeholder="Ask a question or calculator name..." onkeydown="if(event.key === 'Enter') sendChatMessage()">
        <button class="chat-send-btn" onclick="sendChatMessage()">Send</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
